<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presupuesto — Del Palacio S.A.</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0EEEb;color:#18181A;min-height:100vh;font-size:14px}

.topbar{background:#0D4FA0;padding:.75rem 2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{width:34px;height:34px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.topbar-empresa{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.topbar-titulo{font-size:15px;font-weight:700;color:#fff}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-chip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 12px;font-size:12px;color:rgba(255,255,255,.8);font-weight:500}
.user-avatar{width:22px;height:22px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.logout-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);padding:5px 12px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.logout-btn:hover{background:rgba(255,255,255,.15);color:#fff}

.page{max-width:1400px;margin:0 auto;padding:1.5rem 1rem}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:#9896A0;margin-bottom:1rem;font-weight:500}
.breadcrumb a{color:#1E6FD9;text-decoration:none;font-weight:600}
.breadcrumb-sep{color:#DDDBD6}

/* Tables */
.table-container{background:#fff;border:1px solid #DDDBD6;border-radius:10px;overflow:hidden;margin-bottom:1.25rem}
.table-title{padding:12px 16px;font-weight:700;font-size:14px;border-bottom:1px solid #DDDBD6;
  display:flex;align-items:center;justify-content:space-between}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#F8F7F5;padding:7px 10px;text-align:right;font-weight:700;font-size:11px;
  color:#9896A0;border-bottom:1.5px solid #DDDBD6;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
th:first-child{text-align:left;min-width:200px;position:sticky;left:0;z-index:2;background:#F8F7F5}
td{padding:6px 10px;text-align:right;border-bottom:1px solid #F2F1EE;white-space:nowrap}
td:first-child{text-align:left;font-weight:500;position:sticky;left:0;background:#fff;z-index:1}
tr:hover td{background:#F8F7F5}
tr.row-total td{font-weight:700;border-top:2px solid #DDDBD6;background:#F8F7F5!important}
tr.row-category td{background:#F8F7F5;font-weight:700;color:#0D4FA0}
tr.row-sub td:first-child{padding-left:24px;font-weight:400;color:#56555A}
tr.row-result td{font-weight:700;font-size:13px;background:#EBF2FC!important}

.col-total{background:#EBF2FC!important}
.cat-strip{width:4px;height:14px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}

@media(max-width:768px){
  .topbar{padding:.75rem 1rem}
  .page{padding:1rem .75rem}
  th:first-child,td:first-child{min-width:140px}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
    </div>
    <div>
      <div class="topbar-empresa">Distribuidora del Palacio S.A.</div>
      <div class="topbar-titulo">Presupuesto 2026</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="user-chip">
      <div class="user-avatar" id="user-avatar">?</div>
      <span id="user-nombre">—</span>
    </div>
    <button class="logout-btn" onclick="window.location.href='/panel'">Volver</button>
  </div>
</div>

<div class="page">
  <div class="breadcrumb">
    <a href="/panel">Panel</a>
    <span class="breadcrumb-sep">›</span>
    <span>Presupuesto</span>
  </div>

  <!-- Acá vamos a ir armando el presupuesto -->

</div>

<script>
const userData = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!userData) { window.location.href = '/'; }
document.getElementById('user-nombre').textContent = userData.nombre || userData.username;
document.getElementById('user-avatar').textContent = (userData.nombre||userData.username).charAt(0).toUpperCase();
</script>
</body>
</html>
