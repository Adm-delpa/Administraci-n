<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambiente de Trabajo y Compromiso — Gente</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="/gente-shell.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#18181A}
.aus-sedes{display:grid;grid-template-columns:1fr 1fr;margin-top:6px;max-width:360px}
.aus-sede{text-decoration:none;color:inherit;display:block}
.aus-sede + .aus-sede{border-left:1px solid #EEF0F4;padding-left:12px}
.aus-sede:hover .aus-valor{color:#0D4FA0}
.aus-nombre{font-size:11px;color:#9896A0}
.aus-valor{font-size:20px;font-weight:700;letter-spacing:-.02em}
.aus-vacio{font-size:11.5px;color:#B45309;padding-top:4px}
</style>
</head>
<body>
<div class="gs-layout">
<aside class="gs-sidebar" id="gs-sidebar"></aside>
<div class="gs-backdrop" onclick="GenteShell.cerrar()"></div>
<div class="gs-app">
<header class="gs-topbar" id="gs-topbar"></header>
<main class="hub-wrap">
  <div class="hub-eyebrow">Sección 5 · Pilar Gente</div>
  <h1 class="hub-titulo">Ambiente de Trabajo y Compromiso</h1>
  <div class="hub-sub">Ausentismo, clima, comunicación y relaciones laborales</div>
  <div class="hub-kpis" id="kpis"></div>
  <div id="grupos"></div>
</main>
</div>
</div>

<script src="/gente-shell.js"></script>
<script>
const USER = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!USER) window.location.href = '/';
const j = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
const MESES = ['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtPct = v => v == null ? '—' : (v*100).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' %';

const { fila, grupo } = GenteShell.hub;

// Ausentismo Logística a mes cerrado (misma regla que la portada: siempre el mes calendario anterior)
const HOY = new Date(), MES_HOY = HOY.getMonth() + 1;
const MES_C = MES_HOY === 1 ? 12 : MES_HOY - 1, ANIO_C = MES_HOY === 1 ? HOY.getFullYear() - 1 : HOY.getFullYear();
const ausMes = arr => {
  if(!Array.isArray(arr)) return null;
  const x = arr.find(r => r.mes === MES_C);
  return x && x.pct != null && (x.presente + x.ausencia + x.justificada) > 0 ? x : null;
};

function render(ausD, ausC){
  const sede = (href, nombre, x) => '<a class="aus-sede" href="' + href + '"><div class="aus-nombre">' + nombre + '</div>'
    + (x ? '<div class="aus-valor">' + fmtPct(x.pct) + '</div>' : (x === undefined ? '<div class="aus-valor" style="color:#D8D6D2">…</div>' : '<div class="aus-vacio">Sin datos de ' + MESES[MES_C] + '</div>')) + '</a>';
  document.getElementById('kpis').innerHTML = '<div class="hub-kpi">'
    + '<div class="hub-kpi-label"><i class="ti ti-calendar-off" aria-hidden="true"></i>Ausentismo Logística</div>'
    + '<div class="aus-sedes">' + sede('/kpi-ausentismo','Dolores',ausD) + sede('/kpi-ausentismo-cc','Casa Central',ausC) + '</div>'
    + '<div class="hub-kpi-sub">Mes cerrado: ' + MESES[MES_C] + ' ' + ANIO_C + '</div></div>';

  document.getElementById('grupos').innerHTML =
      grupo('Ausentismo', [
        { nombre: 'Ausentismo', desc: 'Registro y seguimiento de ausencias por persona y período', icon: 'ti-calendar-off', href: '/ausentismo', estado: 'Activo' },
        { nombre: 'KPI Ausentismo Dolores', desc: 'Grilla diaria de asistencia y cálculo del KPI', icon: 'ti-chart-line', href: '/kpi-ausentismo', estado: ausD ? fmtPct(ausD.pct) : 'Activo' },
        { nombre: 'KPI Ausentismo Casa Central', desc: 'Grilla diaria de asistencia y cálculo del KPI', icon: 'ti-chart-line', href: '/kpi-ausentismo-cc', estado: ausC ? fmtPct(ausC.pct) : 'Activo' }
      ])
    + grupo('Clima y comunicación', [
        { nombre: 'Engagement', desc: 'Encuestas y resultados de compromiso del equipo', icon: 'ti-heart-handshake', href: '/engagement', estado: 'Próximamente', cls: 'pronto' },
        { nombre: 'Entorno laboral', desc: 'Condiciones y mejoras del ambiente de trabajo', icon: 'ti-building', href: '/entorno-laboral', estado: 'Próximamente', cls: 'pronto' },
        { nombre: 'Plan de comunicaciones', desc: 'Planificación y seguimiento de comunicaciones internas', icon: 'ti-speakerphone', href: '/plan-comunicaciones', estado: 'Próximamente', cls: 'pronto' }
      ])
    + grupo('Relaciones laborales y condiciones', [
        { nombre: 'Negociación sindical', desc: 'Acuerdos, reuniones y seguimiento gremial', icon: 'ti-gavel', href: '/negociacion-sindical', estado: 'Próximamente', cls: 'pronto' },
        { nombre: 'Seguimiento T1', desc: 'Control de descanso entre viajes — Transporte tercerizado', icon: 'ti-truck', href: '/seguimiento-t1', estado: 'Transporte' }
      ]);
}

async function init(){
  render(undefined, undefined);
  GenteShell.init({ activo: p => /ambiente/i.test(p.titulo), titulo: 'Ambiente de Trabajo y Compromiso' });
  const [d, c] = await Promise.all([j('/api/auskpi/calculo?anio=' + ANIO_C), j('/api/auskpi-cc/calculo?anio=' + ANIO_C)]);
  render(ausMes(d), ausMes(c));
}
init();
</script>
</body>
</html>
