<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación del Distribuidor — DPO Gente</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#F2F4F8;color:#18243A;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #D8DEE8;padding:.6rem 1.5rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
.topbar-back{display:flex;align-items:center;gap:5px;background:none;border:none;color:#2563A8;font-size:12.5px;font-weight:600;cursor:pointer;padding:5px 9px;border-radius:6px}
.topbar-back:hover{background:#EBF2FA}
.topbar-sep{color:#D8DEE8}
.topbar-title{font-size:12.5px;font-weight:700;color:#18243A;flex:1}
.page-header{background:linear-gradient(135deg,#1B3F72,#2563A8);padding:18px 24px}
.page-header h1{font-size:16px;font-weight:700;color:#fff}
.page-header p{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.wrap{max-width:800px;margin:0 auto;padding:28px 20px;display:flex;flex-direction:column;gap:20px}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.year-select{background:#fff;border:1.5px solid #D8DEE8;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;color:#18243A;cursor:pointer;font-family:inherit}
.year-select:focus{outline:none;border-color:#2563A8}
.upload-btn{background:#2563A8;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.upload-btn:hover{background:#1B3F72}

/* Archivos */
.arch-grid{display:flex;flex-direction:column;gap:10px}
.arch-item{background:#fff;border:1px solid #D8DEE8;border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:border-color .15s}
.arch-item:hover{border-color:#2563A8}
.arch-icon{font-size:28px;flex-shrink:0}
.arch-info{flex:1;min-width:0}
.arch-name{font-size:13px;font-weight:600;color:#18243A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arch-date{font-size:11px;color:#8A97AA;margin-top:3px}
.arch-ver{background:#F2F4F8;border:1.5px solid #D8DEE8;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:600;color:#18243A;cursor:pointer;font-family:inherit;white-space:nowrap}
.arch-ver:hover{background:#2563A8;color:#fff;border-color:#2563A8}
.arch-del{background:none;border:none;color:#CBD2DC;cursor:pointer;font-size:17px;padding:4px;line-height:1;flex-shrink:0}
.arch-del:hover{color:#EF4444}
.empty{text-align:center;padding:40px 20px;color:#8A97AA;font-size:13px}
.uploading{text-align:center;padding:20px;color:#5E6E89;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <button class="topbar-back" onclick="window.location.href='/ciclo-gente-hub'">← Volver</button>
  <span class="topbar-sep">|</span>
  <span class="topbar-title">Evaluación del Distribuidor</span>
</div>

<div class="page-header">
  <h1>Evaluación del Distribuidor</h1>
  <p>Archivos por año · Ciclo de Gente · DPO Gente</p>
</div>

<div class="wrap">
  <div class="toolbar">
    <select id="yearSel" class="year-select" onchange="cargarArchivos()"></select>
    <button class="upload-btn" onclick="document.getElementById('archInput').click()">+ Subir archivo</button>
    <input type="file" id="archInput" style="display:none"
      accept="application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,image/*"
      multiple onchange="subirArchivo(this)">
  </div>

  <div id="archGrid" class="arch-grid">
    <div class="empty">Seleccioná un año para ver los archivos.</div>
  </div>
</div>

<!-- Visor modal -->
<div id="modalVisor" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:10px;width:92vw;height:92vh;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid #EEF0F6;flex-shrink:0">
      <span id="visorNombre" style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%"></span>
      <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
        <div id="visorSheetTabs" style="display:none;gap:4px;max-width:340px;overflow-x:auto"></div>
        <a id="visorDownload" href="" style="background:#F2F4F8;border:1.5px solid #D8DEE8;border-radius:4px;padding:5px 12px;font-size:12px;font-weight:600;color:#18243A;text-decoration:none">Descargar</a>
        <button onclick="cerrarVisor()" style="background:none;border:none;font-size:22px;color:#8A97AA;cursor:pointer;line-height:1">×</button>
      </div>
    </div>
    <iframe id="visorFrame" src="" style="flex:1;border:none;display:none"></iframe>
    <div id="visorRender" style="flex:1;overflow:auto;padding:20px 28px;font-size:13px;line-height:1.6;display:none"></div>
    <div id="visorLoading" style="flex:1;display:flex;align-items:center;justify-content:center;color:#8A97AA;font-size:13px">Cargando...</div>
  </div>
</div>

<script>
const USER = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!USER) window.location.href = '/';

const anioActual = new Date().getFullYear();

function initYears() {
  const sel = document.getElementById('yearSel');
  for (let y = anioActual; y >= anioActual - 5; y--) {
    const o = document.createElement('option');
    o.value = y; o.textContent = y;
    sel.appendChild(o);
  }
  sel.value = anioActual;
  cargarArchivos();
}

function archivoIcono(tipo) {
  if (!tipo) return '📎';
  if (tipo.includes('pdf')) return '📄';
  if (tipo.includes('word') || tipo.includes('msword')) return '📝';
  if (tipo.includes('sheet') || tipo.includes('excel')) return '📊';
  if (tipo.startsWith('image/')) return '🖼️';
  return '📎';
}

function formatFecha(iso) {
  return new Date(iso).toLocaleDateString('es-AR', { day:'2-digit', month:'short', year:'numeric' });
}

async function cargarArchivos() {
  const anio = document.getElementById('yearSel').value;
  const grid = document.getElementById('archGrid');
  grid.innerHTML = '<div class="uploading">Cargando...</div>';
  try {
    const r = await fetch('/api/distrib/archivos?anio=' + anio);
    const archivos = await r.json();
    if (!archivos.length) {
      grid.innerHTML = '<div class="empty">No hay archivos cargados para ' + anio + '.</div>';
      return;
    }
    grid.innerHTML = archivos.map(a => `
      <div class="arch-item">
        <div class="arch-icon">${archivoIcono(a.tipo)}</div>
        <div class="arch-info">
          <div class="arch-name" title="${a.nombre}">${a.nombre}</div>
          <div class="arch-date">${formatFecha(a.created_at)}</div>
        </div>
        <button class="arch-ver" onclick="abrirVisor(${a.id},'${a.nombre.replace(/'/g,"\\'")}','${(a.tipo||'').replace(/'/g,"\\'")}')">Ver</button>
        <button class="arch-del" onclick="eliminarArchivo(${a.id})" title="Eliminar">🗑</button>
      </div>
    `).join('');
  } catch(e) {
    grid.innerHTML = '<div class="empty">Error al cargar archivos.</div>';
  }
}

async function subirArchivo(input) {
  if (!input.files.length) return;
  const anio = document.getElementById('yearSel').value;
  const grid = document.getElementById('archGrid');
  grid.innerHTML = '<div class="uploading">Subiendo...</div>';
  for (const file of input.files) {
    const fd = new FormData();
    fd.append('archivo', file);
    fd.append('anio', anio);
    await fetch('/api/distrib/archivos', { method: 'POST', body: fd });
  }
  input.value = '';
  cargarArchivos();
}

async function eliminarArchivo(id) {
  if (!confirm('¿Eliminar este archivo?')) return;
  await fetch('/api/distrib/archivos/' + id, { method: 'DELETE' });
  cargarArchivos();
}

let _visorWB = null;
function _visorShowLoading() { document.getElementById('visorLoading').style.display='flex'; document.getElementById('visorFrame').style.display='none'; document.getElementById('visorRender').style.display='none'; document.getElementById('visorSheetTabs').style.display='none'; }
function _visorShowFrame(src) { document.getElementById('visorFrame').src=src; document.getElementById('visorFrame').style.display='block'; document.getElementById('visorLoading').style.display='none'; document.getElementById('visorRender').style.display='none'; document.getElementById('visorSheetTabs').style.display='none'; }
function _visorShowRender(html, sheets) {
  const r=document.getElementById('visorRender'); r.innerHTML=html; r.style.display='block';
  document.getElementById('visorLoading').style.display='none'; document.getElementById('visorFrame').style.display='none';
  const tabs=document.getElementById('visorSheetTabs');
  if (sheets&&sheets.length>1) { tabs.innerHTML=sheets.map((s,i)=>`<button onclick="visorRenderSheet(${i})" id="vshtab_${i}" style="padding:3px 10px;border-radius:4px;border:1px solid #D8DEE8;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;background:${i===0?'#1B3F72':'#fff'};color:${i===0?'#fff':'#5A6880'}">${s}</button>`).join(''); tabs.style.display='flex'; } else { tabs.style.display='none'; }
}
function visorRenderSheet(idx) { if(!_visorWB)return; const ws=_visorWB.Sheets[_visorWB.SheetNames[idx]]; document.getElementById('visorRender').innerHTML=xlsxSheetHtml(ws); document.querySelectorAll('#visorSheetTabs button').forEach((b,i)=>{b.style.background=i===idx?'#1B3F72':'#fff';b.style.color=i===idx?'#fff':'#5A6880';}); }
function xlsxSheetHtml(ws) { return `<style>#xlsheet{border-collapse:collapse;font-size:12px;width:100%}#xlsheet td,#xlsheet th{border:1px solid #D8DEE8;padding:5px 8px;white-space:nowrap}#xlsheet tr:first-child td,#xlsheet tr:first-child th{background:#1B3F72;color:#fff;font-weight:700}#xlsheet tr:nth-child(even) td{background:#F5F7FB}</style>`+XLSX.utils.sheet_to_html(ws,{id:'xlsheet',editable:false}); }
function loadScript(src) { return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);}); }

async function abrirVisor(id, nombre, tipo) {
  const url = '/api/distrib/archivos/' + id + '/file';
  document.getElementById('visorNombre').textContent = nombre;
  document.getElementById('visorDownload').href = url;
  document.getElementById('visorDownload').download = nombre;
  document.getElementById('modalVisor').style.display = 'flex';
  _visorShowLoading(); _visorWB = null;
  const ext = nombre.split('.').pop().toLowerCase();
  const esExcel = ext==='xlsx'||ext==='xls'||(tipo&&(tipo.includes('sheet')||tipo.includes('excel')));
  const esWord  = ext==='docx'||ext==='doc'||(tipo&&(tipo.includes('word')||tipo.includes('msword')));
  const esPDF   = ext==='pdf'||(tipo&&tipo.includes('pdf'));
  if (esPDF) { _visorShowFrame(url); return; }
  try {
    const buf = await (await fetch(url)).arrayBuffer();
    if (esExcel) {
      if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      _visorWB = XLSX.read(buf,{type:'array'});
      _visorShowRender(xlsxSheetHtml(_visorWB.Sheets[_visorWB.SheetNames[0]]),_visorWB.SheetNames);
    } else if (esWord) {
      if (!window.mammoth) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      const result = await mammoth.convertToHtml({arrayBuffer:buf});
      _visorShowRender(`<style>#visorRender h1,#visorRender h2,#visorRender h3{color:#1B3F72;margin:1em 0 .4em;font-weight:700}#visorRender p{margin-bottom:.7em}#visorRender table{border-collapse:collapse;width:100%;margin:1em 0;font-size:12px}#visorRender td,#visorRender th{border:1px solid #D8DEE8;padding:5px 8px}#visorRender th{background:#F5F7FB;font-weight:700}</style>`+result.value,null);
    } else { _visorShowFrame(url); }
  } catch(e) {
    document.getElementById('visorRender').innerHTML=`<div style="color:#B91C1C;padding:20px">Error: ${e.message}</div>`;
    document.getElementById('visorRender').style.display='block'; document.getElementById('visorLoading').style.display='none';
  }
}

function cerrarVisor() {
  document.getElementById('modalVisor').style.display = 'none';
  document.getElementById('visorFrame').src = '';
  document.getElementById('visorRender').innerHTML = '';
  _visorWB = null;
}

initYears();
</script>
</body>
</html>
