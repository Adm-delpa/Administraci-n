<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reclutamiento y Selección — Gente</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="/gente-shell.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#18181A}

.wrap{max-width:1000px;width:100%;margin:0 auto;padding:2rem 2.25rem 3rem}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#0D4FA0}
.titulo{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.sub{font-size:13px;color:#6B6A70;margin-top:3px}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:1.5rem}
.kpi{border:1px solid #E6E8EE;border-radius:10px;padding:13px 16px;text-decoration:none;color:inherit;display:block}
a.kpi:hover{border-color:#0D4FA0}
.kpi-label{font-size:12px;font-weight:500;color:#6B6A70;display:flex;align-items:center;gap:6px}
.kpi-label i{font-size:15px;color:#0D4FA0}
.kpi-valor{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.kpi-sub{font-size:11.5px;color:#9896A0;margin-top:2px}

.grupo-titulo{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0D4FA0;margin:2rem 0 .6rem}
.lista{border:1px solid #E6E8EE;border-radius:10px;overflow:hidden}
.fila{display:grid;grid-template-columns:36px minmax(0,1fr) auto 16px;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #F0F1F4;text-decoration:none;color:inherit;transition:background .12s}
.fila:first-child{border-top:none}
.fila:hover{background:#F7F9FC}
.fila:hover .fila-nombre{color:#0D4FA0}
.fila-icon{width:36px;height:36px;border-radius:8px;background:#EAF1FB;color:#0D4FA0;display:flex;align-items:center;justify-content:center;font-size:19px}
.fila-nombre{font-size:13.5px;font-weight:600;color:#18181A}
.fila-desc{font-size:12px;color:#9896A0;margin-top:1px}
.fila-estado{font-size:12px;color:#6B6A70;white-space:nowrap;text-align:right}
.fila-estado.alerta{color:#B91C1C;font-weight:600}
.fila-estado.ok{color:#15803D;font-weight:600}
.fila-estado.vacio{color:#B45309;font-weight:600}
.fila-arrow{color:#B4B2A9;font-size:16px}
.empty{color:#9896A0;font-size:13px;padding:1rem 0}

@media(max-width:860px){
  .wrap{padding:1.25rem 1rem 2rem}
  .titulo{font-size:21px}
  .kpis{grid-template-columns:1fr}
  .fila{grid-template-columns:32px minmax(0,1fr) 16px;padding:11px 12px}
  .fila-icon{width:32px;height:32px;font-size:17px}
  .fila-estado{grid-column:2;text-align:left;margin-top:-6px}
  .fila-arrow{grid-row:1;grid-column:3}
}
</style>
</head>
<body>
<div class="gs-layout">
<aside class="gs-sidebar" id="gs-sidebar"></aside>
<div class="gs-backdrop" onclick="GenteShell.cerrar()"></div>
<div class="gs-app">
<header class="gs-topbar" id="gs-topbar"></header>

<main class="wrap">
  <div class="eyebrow">Sección 2 · Pilar Gente</div>
  <h1 class="titulo">Reclutamiento y Selección</h1>
  <div class="sub" id="sub">Herramientas, procesos e indicadores de selección de personal</div>

  <div class="kpis" id="kpis"></div>
  <div id="grupos"><div class="empty">Cargando…</div></div>
</main>
</div>
</div>

<script src="/gente-shell.js"></script>
<script>
const USER = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!USER) window.location.href = '/';

const HOY = new Date(), ANIO = HOY.getFullYear(), HOY_MES = HOY.getMonth() + 1;
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const j = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);

// Grupos del plan de demanda (mismos que plan-demanda.html)
const GRUPOS_PLAN = [
  'Distribucion - Chofer - Fijo','Distribucion - Chofer - Temporada',
  'Distribucion - Ayudante - Fijo','Distribucion - Ayudante - Temporada',
  'Deposito - Operario - Fijo','Deposito - Operario - Temporada',
  'Administrativos - Administrativo - Fijo'
];
// Desvíos sin justificar en meses cerrados del año (presupuestado vs. real)
function desviosSinJustificar(plan, coments){
  if(!plan) return null;
  const C = {};
  if(Array.isArray(coments)) coments.forEach(r => { (C[r.grupo] = C[r.grupo] || {})[r.mes] = { estado: r.estado }; });
  else if(coments) Object.assign(C, coments);
  let n = 0;
  GRUPOS_PLAN.forEach(g => {
    const gd = plan[g] || {};
    for(let m = 1; m < HOY_MES; m++){
      const x = gd[m] || {};
      const d = (x.real || 0) - (x.presupuestado || 0);
      const est = (C[g] && C[g][m] && C[g][m].estado) || 'sin_justificar';
      if(d !== 0 && est === 'sin_justificar') n++;
    }
  });
  return n;
}

const plural = (n, s, p) => n + ' ' + (n === 1 ? s : p);

function fila(f){
  return '<a class="fila" href="' + esc(f.href) + '">'
    + '<span class="fila-icon"><i class="ti ' + f.icon + '" aria-hidden="true"></i></span>'
    + '<span><span class="fila-nombre" style="display:block">' + esc(f.nombre) + '</span>'
    + (f.desc ? '<span class="fila-desc" style="display:block">' + esc(f.desc) + '</span>' : '') + '</span>'
    + '<span class="fila-estado ' + (f.cls || '') + '">' + esc(f.estado || '') + '</span>'
    + '<i class="ti ti-chevron-right fila-arrow" aria-hidden="true"></i></a>';
}

function estadoPlan(n){
  if(n == null) return { estado: '—' };
  return n > 0 ? { estado: plural(n, 'desvío sin justificar', 'desvíos sin justificar'), cls: 'alerta' } : { estado: 'Sin desvíos', cls: 'ok' };
}

async function init(){
  const paginasP = GenteShell.init({ activo: p => /reclutamiento/i.test(p.titulo), titulo: 'Reclutamiento y Selección' });
  const [paginas, cand, vac, planD, comD, planC, comC] = await Promise.all([
    paginasP,
    j('/api/candidatos'),
    j('/api/vacantes'),
    j('/api/plan-demanda/dolores/' + ANIO), j('/api/plan-comentarios/dolores/' + ANIO),
    j('/api/plan-demanda-cc/central/' + ANIO), j('/api/plan-comentarios-cc/central/' + ANIO)
  ]);

  const nCand = Array.isArray(cand) ? cand.length : null;
  const sinEntrevista = Array.isArray(cand) ? cand.filter(c => c.estado === 'Sin entrevista').length : 0;
  // Abierta = sin fecha de finalización (misma regla que el módulo Vacantes)
  const nVac = Array.isArray(vac) ? vac.filter(v => !v.fecha_finalizacion).length : null;
  const dD = desviosSinJustificar(planD, comD), dC = desviosSinJustificar(planC, comC);

  document.getElementById('kpis').innerHTML =
      '<a class="kpi" href="/base-candidatos"><div class="kpi-label"><i class="ti ti-users" aria-hidden="true"></i>Candidatos en base</div>'
    + '<div class="kpi-valor">' + (nCand == null ? '—' : nCand) + '</div><div class="kpi-sub">' + (nCand ? plural(sinEntrevista, 'sin entrevista', 'sin entrevista') : '&nbsp;') + '</div></a>'
    + '<a class="kpi" href="/vacantes"><div class="kpi-label"><i class="ti ti-briefcase" aria-hidden="true"></i>Vacantes abiertas</div>'
    + '<div class="kpi-valor">' + (nVac == null ? '—' : nVac) + '</div><div class="kpi-sub">' + (nVac === 0 ? 'Ninguna en curso' : 'en búsqueda') + '</div></a>'
    + '<a class="kpi" href="/plan-demanda?sucursal=dolores"><div class="kpi-label"><i class="ti ti-chart-bar" aria-hidden="true"></i>Plan de demanda</div>'
    + '<div class="kpi-valor" style="font-size:17px;padding-top:4px">Dolores ' + (dD == null ? '—' : dD) + ' · CC ' + (dC == null ? '—' : dC) + '</div>'
    + '<div class="kpi-sub">desvíos sin justificar · meses cerrados ' + ANIO + '</div></a>';

  const reclu = (paginas || []).find(p => !p.parent_id && /reclutamiento/i.test(p.titulo));
  const hijos = reclu ? paginas.filter(p => p.parent_id === reclu.id).sort((a,b) => (a.orden||0) - (b.orden||0)) : [];

  const proceso = [], planif = [], gestion = [];
  hijos.forEach(h => {
    const t = h.titulo.toLowerCase();
    const nombre = GenteShell.acentos(h.titulo);
    if(t.includes('candidato')){
      gestion.unshift({ nombre: 'Base de candidatos', desc: 'Estado y seguimiento de cada candidato', icon: 'ti-users', href: '/base-candidatos',
        estado: nCand == null ? '' : plural(nCand, 'candidato', 'candidatos') });
    } else if(t.includes('plan') || t.includes('demanda')){
      planif.unshift(Object.assign({ nombre: 'Plan de demanda — Dolores', desc: 'Nómina mensual, presupuesto vs. real y vacaciones', icon: 'ti-chart-bar', href: '/plan-demanda?sucursal=dolores' }, estadoPlan(dD)));
    } else {
      const docs = (h.bloques || []).filter(b => b.tipo === 'embed').length;
      const info = t.includes('sop') ? { nombre: 'SOP de reclutamiento', desc: 'Procedimientos operativos de reclutamiento y selección', icon: 'ti-file-text' }
                 : t.includes('sesgo') ? { nombre: nombre, desc: 'Política DEI, compliance y capacitación en diversidad', icon: 'ti-scale' }
                 : (t.includes('descripcion') || t.includes('descripción') || t.includes('puesto')) ? { nombre: nombre, desc: 'Organigrama y perfiles de cada puesto por sucursal', icon: 'ti-sitemap' }
                 : { nombre: nombre, desc: '', icon: 'ti-file' };
      proceso.push(Object.assign(info, { href: '/pilar-gente?vista=' + h.id,
        estado: docs ? plural(docs, 'documento', 'documentos') : 'Sin contenido', cls: docs ? '' : 'vacio' }));
    }
  });
  proceso.push({ nombre: 'Marca empleadora', desc: 'Enlaces y recursos de marca empleadora', icon: 'ti-speakerphone', href: '/marca-empleadora', estado: 'Links' });
  planif.push(Object.assign({ nombre: 'Plan de demanda — Casa Central', desc: 'Nómina mensual, presupuesto vs. real y vacaciones', icon: 'ti-chart-bar', href: '/plan-demanda-cc' }, estadoPlan(dC)));
  planif.push({ nombre: 'Simuladores de dimensionamiento', desc: 'Simuladores y herramientas para dimensionar equipos', icon: 'ti-ruler-measure', href: '/simuladores-dimensionamiento', estado: 'Links' });
  planif.push({ nombre: 'Análisis de tendencias de la fuerza laboral', desc: 'Dotación, ingresos, egresos y antigüedad en el tiempo', icon: 'ti-trending-up', href: '/tendencias', estado: 'Análisis' });
  planif.push({ nombre: 'Mapa de calor', desc: 'Cobertura y sucesión de puestos clave', icon: 'ti-grid-dots', href: '/mapa-calor', estado: 'Sucesión' });
  gestion.push({ nombre: 'Vacancy Fulfillment', desc: 'Búsquedas, candidatos y tiempo de cobertura', icon: 'ti-briefcase', href: '/vacantes',
    estado: nVac == null ? '' : plural(nVac, 'abierta', 'abiertas') });
  gestion.push({ nombre: 'Base de personal temporario', desc: 'Por temporada, sucursal y área', icon: 'ti-user-clock', href: '/base-temporarios', estado: 'Registro' });

  const bloque = (titulo, items) => items.length ? '<div class="grupo-titulo">' + titulo + '</div><div class="lista">' + items.map(fila).join('') + '</div>' : '';
  document.getElementById('grupos').innerHTML =
      bloque('Proceso y políticas', proceso)
    + bloque('Planificación de la dotación', planif)
    + bloque('Gestión de candidatos y cobertura', gestion);
}

init();
</script>
</body>
</html>
