<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprendizaje y Desarrollo — Gente</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="/gente-shell.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#18181A}
</style>
</head>
<body>
<div class="gs-layout">
<aside class="gs-sidebar" id="gs-sidebar"></aside>
<div class="gs-backdrop" onclick="GenteShell.cerrar()"></div>
<div class="gs-app">
<header class="gs-topbar" id="gs-topbar"></header>
<main class="hub-wrap">
  <div class="hub-eyebrow">Sección 4 · Pilar Gente</div>
  <h1 class="hub-titulo">Aprendizaje y Desarrollo</h1>
  <div class="hub-sub">Plan anual de capacitación, inducciones y formación</div>
  <div id="grupos"><div class="hub-empty">Cargando…</div></div>
</main>
</div>
</div>

<script src="/gente-shell.js"></script>
<script>
const USER = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!USER) window.location.href = '/';
const j = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);

// Adherencia del PAC: capacitaciones con fecha de ejecución / total (igual que antes)
function adherencia(caps){
  if(!Array.isArray(caps) || !caps.length) return { estado: 'Sin capacitaciones', cls: 'pronto' };
  const pct = Math.round(caps.filter(c => !!c.fecha_ejecucion).length / caps.length * 100);
  return { estado: pct + '% adherencia', cls: pct >= 90 ? 'ok' : pct >= 60 ? 'medio' : '' };
}

async function init(){
  const { fila, grupo } = GenteShell.hub;
  const [paginas, pac, pacCc] = await Promise.all([
    GenteShell.init({ activo: p => /aprendizaje/i.test(p.titulo), titulo: 'Aprendizaje y Desarrollo' }),
    j('/api/pac'), j('/api/pac-cc')
  ]);

  const planes = [
    Object.assign({ nombre: 'PAC Dolores', desc: 'Plan anual de capacitación — Dolores', icon: 'ti-calendar-event', href: '/pac' }, adherencia(pac)),
    Object.assign({ nombre: 'PAC Casa Central', desc: 'Plan anual de capacitación — Casa Central', icon: 'ti-calendar-event', href: '/pac-cc' }, adherencia(pacCc))
  ];

  // Otras páginas cargadas en el editor dentro de Aprendizaje (Inducciones, SKAP, etc.)
  const raiz = (paginas || []).find(p => !p.parent_id && p.titulo.includes('Aprendizaje'));
  const formacion = raiz ? paginas.filter(p => p.parent_id === raiz.id && !p.titulo.includes('PAC'))
    .sort((a,b) => (a.orden||0) - (b.orden||0))
    .map(h => {
      const n = (h.bloques || []).filter(b => b.tipo === 'embed').length;
      const t = h.titulo.toLowerCase();
      return { nombre: GenteShell.acentos(h.titulo), href: '/pilar-gente?vista=' + h.id,
        icon: t.includes('induc') ? 'ti-door-enter' : t.includes('skap') ? 'ti-certificate' : 'ti-file-text',
        estado: n ? n + (n === 1 ? ' documento' : ' documentos') : 'Sin contenido', cls: n ? '' : 'vacio' };
    }) : [];

  document.getElementById('grupos').innerHTML = grupo('Plan anual de capacitación', planes) + grupo('Formación', formacion);
}
init();
</script>
</body>
</html>
