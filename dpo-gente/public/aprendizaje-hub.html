<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprendizaje y Desarrollo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#F2F4F8;color:#18243A;min-height:100vh}

.topbar{background:#fff;border-bottom:1px solid #D8DEE8;padding:.6rem 1.5rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
.topbar-back{display:flex;align-items:center;gap:5px;background:none;border:none;color:#2563A8;font-size:12.5px;font-weight:600;cursor:pointer;padding:5px 9px;border-radius:6px}
.topbar-back:hover{background:#EBF2FA}
.topbar-sep{color:#D8DEE8}
.topbar-title{font-size:12.5px;font-weight:700;color:#18243A;flex:1}

.page-header{background:#1B3F72;padding:18px 24px}
.page-header h1{font-size:16px;font-weight:700;color:#fff}
.page-header p{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}

.wrap{max-width:960px;margin:0 auto;padding:24px 20px}

.mod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mod-card{background:#fff;border:1px solid #D8DEE8;border-radius:10px;padding:20px 18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:box-shadow .15s,border-color .15s;text-align:left;width:100%}
.mod-card:hover{border-color:#2563A8;box-shadow:0 2px 14px rgba(37,99,168,.12)}
.mod-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,#2563A8)}
.mod-icon{font-size:28px;line-height:1}
.mod-title{font-size:13px;font-weight:700;color:#18243A}
.mod-desc{font-size:11.5px;color:#8A97AA;line-height:1.5;flex:1}
.mod-footer{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.mod-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.mod-arr{font-size:11px;color:#2563A8;font-weight:600}
.badge-navy{background:#EBF2FA;color:#1B3F72}
.badge-green{background:#D1FAE5;color:#065F46}
.badge-orange{background:#FEF3C7;color:#92400E}
.badge-gray{background:#F1F5F9;color:#64748B}

.empty{color:#8A97AA;font-size:12px;padding:6px 0}
</style>
</head>
<body>

<div class="topbar">
  <button class="topbar-back" onclick="window.location.href='/pilar-gente'">← Volver</button>
  <span class="topbar-sep">|</span>
  <span class="topbar-title">Aprendizaje y Desarrollo</span>
</div>

<div class="page-header">
  <h1>Aprendizaje y Desarrollo</h1>
  <p>DPO Gente 2026</p>
</div>

<div class="wrap">
  <div class="mod-grid" id="mod-grid">
    <div class="empty" style="grid-column:1/-1">Cargando…</div>
  </div>
</div>

<script>
const USER = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!USER) window.location.href = '/';

async function init() {
  const grid = document.getElementById('mod-grid');
  try {
    // KPIs del PAC para el badge
    let pacTotal = 0, pacRealizadas = 0;
    try {
      const caps = await fetch('/api/pac').then(r => r.json());
      pacTotal = caps.length;
      pacRealizadas = caps.filter(c => !!c.fecha_ejecucion).length;
    } catch(e) {}

    grid.innerHTML = '';

    // PAC
    const cardPac = document.createElement('button');
    cardPac.className = 'mod-card';
    cardPac.style.setProperty('--accent', '#0891B2');
    cardPac.onclick = () => window.location.href = '/pac';
    const pct = pacTotal > 0 ? Math.round(pacRealizadas / pacTotal * 100) : 0;
    const badgeCls = pct >= 90 ? 'badge-green' : pct >= 60 ? 'badge-orange' : 'badge-gray';
    cardPac.innerHTML = `
      <div class="mod-icon">📅</div>
      <div class="mod-title">Plan Anual de Capacitación (PAC)</div>
      <div class="mod-desc">Seguimiento de capacitaciones por pilar: asistencia, aprobación y adherencia al GANTT.</div>
      <div class="mod-footer"><span class="mod-badge ${badgeCls}">${pct}% adherencia</span><span class="mod-arr">Abrir →</span></div>`;
    grid.appendChild(cardPac);

    // Otras páginas CMS de Aprendizaje y Desarrollo (Inducciones, SKAP, etc.)
    const paginas = await fetch('/api/paginas').then(r => r.json());
    const aprendizaje = paginas.find(p => !p.parent_id && p.titulo.includes('Aprendizaje'));
    if (aprendizaje) {
      const hijos = paginas.filter(p => p.parent_id === aprendizaje.id && !p.titulo.includes('PAC'))
        .sort((a, b) => a.orden - b.orden);
      hijos.forEach(h => {
        const n = (h.bloques || []).filter(b => b.tipo === 'embed').length;
        const card = document.createElement('button');
        card.className = 'mod-card';
        card.style.setProperty('--accent', '#1B3F72');
        card.onclick = () => window.location.href = `/pilar-gente?vista=${h.id}`;
        card.innerHTML = `
          <div class="mod-icon">📄</div>
          <div class="mod-title">${h.titulo}</div>
          <div class="mod-desc"></div>
          <div class="mod-footer"><span class="mod-badge ${n > 0 ? 'badge-navy' : 'badge-gray'}">${n > 0 ? n + ' documento' + (n !== 1 ? 's' : '') : 'Sin contenido'}</span><span class="mod-arr">Abrir →</span></div>`;
        grid.appendChild(card);
      });
    }
  } catch(e) {
    document.getElementById('mod-grid').innerHTML = '<div class="empty">No se pudo cargar.</div>';
  }
}

init();
</script>
</body>
</html>
