<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comité de Gente Logístico — Gente</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="/gente-shell.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#18181A}
</style>
</head>
<body>
<div class="gs-layout">
<aside class="gs-sidebar" id="gs-sidebar"></aside>
<div class="gs-backdrop" onclick="GenteShell.cerrar()"></div>
<div class="gs-app">
<header class="gs-topbar" id="gs-topbar"></header>
<main class="hub-wrap">
  <div class="hub-eyebrow">Comité de Gente · Dolores</div>
  <h1 class="hub-titulo">Comité de Gente Logístico</h1>
  <div class="hub-sub">Equipos autónomos · GOPs · Reuniones · Seguimiento de acciones</div>
  <div class="hub-kpis" id="kpis"></div>
  <div id="grupos"></div>
</main>
</div>
</div>

<script src="/gente-shell.js"></script>
<script>
const USER = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!USER) window.location.href = '/';
const ANIO = new Date().getFullYear();
const { grupo, kpi } = GenteShell.hub;

function render(d){
  const cargando = d === undefined;
  const v = x => cargando ? '<span style="color:#D8D6D2">…</span>' : x;
  let prox = 'Sin agendar', proxSub = '';
  if(d && d.proxima_reunion){
    const f = new Date(String(d.proxima_reunion).split('T')[0] + 'T12:00:00');
    prox = f.toLocaleDateString('es-AR', { day:'2-digit', month:'short' });
    proxSub = f.toLocaleDateString('es-AR', { weekday:'long' });
  }
  document.getElementById('kpis').innerHTML =
      kpi({ href: '/comite-gente/reuniones', icon: 'ti-calendar', label: 'Reuniones ' + ANIO, valor: v(d ? (d.reuniones_anio ?? 0) : '—'), sub: 'realizadas este año' })
    + kpi({ href: '/comite-gente/pda', icon: 'ti-checklist', label: 'Acciones pendientes', valor: v(d ? (d.acciones_pendientes ?? 0) : '—'), sub: 'en seguimiento' })
    + kpi({ href: '/comite-gente/reuniones', icon: 'ti-calendar-time', label: 'Próxima reunión', valor: v(d ? prox : '—'), sub: proxSub, chico: true });

  document.getElementById('grupos').innerHTML = grupo('Herramientas', [
    { nombre: 'Reuniones y asistencia', desc: 'Registro de reuniones, asistencia, temario y acciones emergentes', icon: 'ti-calendar', href: '/comite-gente/reuniones', estado: 'Disponible' },
    { nombre: 'GOPs — Grupos operativos', desc: '7 checklists de áreas operativas con avance mensual. Meta ≥ 80%', icon: 'ti-users-group', href: '/comite-gente/gops', estado: 'Disponible' },
    { nombre: 'PDA — Plan de acción', desc: 'Plan de acción anual del comité con responsables y fechas', icon: 'ti-checklist', href: '/comite-gente/pda', estado: 'Disponible' }
  ]);
}

async function init(){
  render(undefined);
  GenteShell.init({ activo: p => /comit/i.test(p.titulo), titulo: 'Comité de Gente · Dolores' });
  let d = null;
  try { const r = await fetch('/api/comite/resumen'); d = r.ok ? await r.json() : null; } catch(e) {}
  render(d);
}
init();
</script>
</body>
</html>
