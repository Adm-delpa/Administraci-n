<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talento y Crecimiento — Gente</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="/gente-shell.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#18181A}
</style>
</head>
<body>
<div class="gs-layout">
<aside class="gs-sidebar" id="gs-sidebar"></aside>
<div class="gs-backdrop" onclick="GenteShell.cerrar()"></div>
<div class="gs-app">
<header class="gs-topbar" id="gs-topbar"></header>
<main class="hub-wrap">
  <div class="hub-eyebrow">Sección 6 · Pilar Gente</div>
  <h1 class="hub-titulo">Talento y Crecimiento</h1>
  <div class="hub-sub">Desarrollo de personas y ciclo de talento</div>
  <div class="hub-kpis" id="kpis"></div>
  <div id="grupos"></div>
</main>
</div>
</div>

<script src="/gente-shell.js"></script>
<script>
const USER = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!USER) window.location.href = '/';
const j = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
const MESES = ['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtPct = v => v == null ? '—' : (v*100).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' %';
const ANIO = new Date().getFullYear();
const { fila, grupo, kpi } = GenteShell.hub;

function render(tto){
  const cargando = tto === undefined;
  let dot = null, rot = null, obj = null;
  if(tto){
    // Dotación: último mes cargado del año (igual que la portada)
    for(let m = 12; m >= 1; m--){ if(tto.months[m]){ dot = { valor: tto.months[m].dot_total, mes: m }; break; } }
    // Rotación YTD: bajas indeterminados con reemplazo / dotación indeterminados (igual que KPI Turnover)
    let b = 0, d = 0;
    for(let m = 1; m <= 12; m++){ const x = tto.months[m]; if(x){ b += x.tto_indet || 0; d += x.dot_indet || 0; } }
    rot = d ? b / d : null;
    obj = tto.config ? parseFloat(tto.config.obj_tto_indeterminados) : null;
  }
  const v = x => cargando ? '<span style="color:#D8D6D2">…</span>' : x;
  document.getElementById('kpis').innerHTML =
      kpi({ href: '/kpi-turnover', icon: 'ti-users', label: 'Dotación', valor: v(dot ? dot.valor.toLocaleString('es-AR') : '—'),
            sub: cargando ? '' : dot ? 'personas · ' + MESES[dot.mes] : 'Sin datos cargados' })
    + kpi({ href: '/kpi-turnover', icon: 'ti-arrows-exchange', label: 'Rotación', valor: v(fmtPct(rot)),
            sub: cargando ? '' : rot == null ? 'Sin datos cargados' : 'acumulado ' + ANIO + (obj ? ' · obj. ' + fmtPct(obj) : '') });

  document.getElementById('grupos').innerHTML = grupo('Herramientas', [
    { nombre: 'Ciclo de gente', desc: 'OPR, evaluación del distribuidor y evaluación de desempeño', icon: 'ti-refresh', href: '/ciclo-gente-hub', estado: 'People Cycle' },
    { nombre: 'KPI Turnover', desc: 'Rotación voluntaria e involuntaria por período y sector', icon: 'ti-arrows-exchange', href: '/kpi-turnover', estado: 'Rotación' }
  ]);
}

async function init(){
  render(undefined);
  GenteShell.init({ activo: p => /talento/i.test(p.titulo), titulo: 'Talento y Crecimiento' });
  render(await j('/api/turnover/dashboard?anio=' + ANIO));
}
init();
</script>
</body>
</html>
